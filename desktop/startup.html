<script>
let elapsed=0,duration=6000,playing=true,last=0;const $=id=>document.getElementById(id),ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)},s=(p,a,b)=>ease((p-a)/(b-a));function render(){

 target.style.visibility=p>=1?'visible':'hidden';if(p>=1){parent.postMessage({type:'shishi-startup-complete'},'*');$('logo').style.opacity=0;word.style.opacity=0;}
 $('seek').value=p*1000;$('time').textContent=(elapsed/1000).toFixed(1)+' / '+duration/1000+' 秒';$('phase').textContent=p<.46?'光柱向下展开':p<.70?'悬浮线条组成 Logo':p<.83?'品牌停留':'Logo 回到左上角';
}function tick(now){if(last&&playing){elapsed=Math.min(duration,elapsed+now-last);if(elapsed>=duration){playing=false;$('pause').textContent='播放'}}last=now;render();requestAnimationFrame(tick)}function replay(){elapsed=0;playing=true;$('pause').textContent='暂停'}function skip(){elapsed=duration;playing=false;$('pause').textContent='播放';render()}$('pause').onclick=()=>{if(elapsed>=duration){replay();return}playing=!playing;$('pause').textContent=playing?'暂停':'播放'};$('seek').oninput=e=>{elapsed=duration*e.target.value/1000;playing=false;$('pause').textContent='播放';render()};$('speed').onchange=e=>{duration=+e.target.value;replay()};document.addEventListener('keydown',e=>{if(e.key==='Escape')skip()});requestAnimationFrame(tick);
