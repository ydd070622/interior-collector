<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材库 · 室内灵感采集</title><link rel="stylesheet" href="library.css"></head>
<body>
  <header class="app-header"><a href="#" id="home" class="brand"><span aria-hidden="true">◧</span> 室内灵感采集 <span>／ 素材库</span></a><div class="header-actions"><span id="syncState" role="status" aria-live="polite">读取本地素材…</span><button id="refresh">刷新</button><button id="import" class="primary">导入文件夹</button></div></header>
  <div class="workspace"><aside aria-label="素材文件夹"><div class="sidebar-panel"><div class="sidebar-header"><span>素材目录</span><button id="toggleFolders" aria-expanded="true" aria-controls="folderSection" aria-label="收起文件夹栏"></button></div><button id="all" class="folder-button">全部素材</button><section id="folderSection"><nav id="folders"></nav></section><button id="manageFolders" aria-label="管理文件夹" class="manage-folders" title="管理文件夹">⚙ <span>管理文件夹</span></button></div></aside><div id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="调整左侧栏宽度" tabindex="0" title="拖动调整左侧栏宽度，双击恢复默认"></div>
  <main>
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置"></nav>
    <section class="page-heading"><div><h1 id="heading">全部素材</h1><p id="summary"></p></div></section>
    <section id="toolbar" class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索案例、图片或文件夹名称…" aria-label="搜索素材"></label><label class="sort-label"><select id="sort" aria-label="排序"><option value="folder-desc">文件夹序号 ↓</option><option value="folder-asc">文件夹序号 ↑</option><option value="recent">最近下载</option><option value="name">名称排序</option></select></label><div class="view-switch" aria-label="浏览方式"><button id="caseView" aria-pressed="true">案例</button><button id="imageView" aria-pressed="false">图片</button></div></section>
    <nav id="folderFilters" class="folder-filters" aria-label="按保存文件夹筛选"></nav>
    <p id="notice" class="notice" hidden></p><section id="gallery" class="gallery" aria-label="素材列表"></section><div id="empty" class="empty" hidden><h2 id="emptyTitle">还没有素材</h2><p id="emptyDescription">导入已有素材文件夹，或在采集窗口保存图片后回来刷新。</p></div><button id="loadMore" class="load-more" hidden>加载更多</button>
  </main></div>
  <dialog id="viewer" aria-labelledby="viewerTitle"><header><h2 id="viewerTitle">图片预览</h2><button id="closeViewer" aria-label="关闭预览">×</button></header><div class="viewer-stage"><button id="previous" class="arrow previous" aria-label="上一张">‹</button><img id="original" alt=""><button id="next" class="arrow next" aria-label="下一张">›</button><p id="viewerStatus" role="status"></p></div><footer class="viewer-recovery"><div hidden><p id="imageName"></p><small id="imageLocation"></small></div><div class="actions"><button id="authorize">授权读取原图</button><button id="showDownload" hidden>在文件夹中显示</button></div></footer></dialog>
  <dialog id="folderManager" aria-labelledby="folderManagerTitle"><header><h2 id="folderManagerTitle">管理文件夹</h2><button id="closeFolderManager" aria-label="关闭文件夹管理">×</button></header><p class="manager-note">移除后不再显示和参与历史去重，电脑上的文件会保留；可随时重新导入。</p><div id="managedFolders"></div><p id="managerError" role="alert"></p></dialog>
  <script type="module" src="library.js"></script>
</body></html>
