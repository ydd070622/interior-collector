<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>室内灵感采集</title><link rel="stylesheet" href="style.css"></head><body><main><p id="source">正在读取网页…</p><div class="limit-row"><label for="noteLimit">图文篇数</label><input id="noteLimit" type="number" min="1" step="1" placeholder="不限"><fieldset class="image-mode"><legend>提取类型</legend><label><input type="radio" name="imageMode" value="interior" checked>室内</label><label title="不限题材，保留尺寸过滤"><input type="radio" name="imageMode" value="all">其他</label></fieldset><button id="rescan">开始提取 →</button></div><section class="settings"><div><label for="format">输出格式</label><select id="format"><option value="png">PNG</option><option value="jpg">JPG</option></select></div><div class="folder"><label for="folder">保存文件夹</label><button id="folder"><span id="folderName">选择保存文件夹</span><span aria-hidden="true">⌄</span></button></div></section><section class="toolbar"><strong id="count">0 张室内图片</strong><button id="stop" disabled>停止识别</button></section><progress id="progress" value="0" max="1"></progress><span id="status" role="status" aria-live="polite">准备提取</span><p id="notice" hidden></p><section id="grid" class="grid"></section><div id="empty" class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 20V4h18v16M3 14h18M9 4v16M15 14v6"/></svg><span>暂无图片</span></div><button id="download" disabled>下载全部图片 ↓</button><details><summary id="detailsTitle">采集记录</summary><ul id="logs"></ul></details></main><script type="module" src="popup.js"></script></body></html>
